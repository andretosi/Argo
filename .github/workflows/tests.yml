name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A newer push to the same branch or pull request cancels the run in progress
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Ruff (same version as .pre-commit-config.yaml)
        run: |
          pip install "ruff==0.17.3"
          ruff check .
          ruff format --check .

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: ml_training
    env:
      PYTHONPATH: ${{ github.workspace }}/ml_training  # spotmicro, commands, training, ...
      SDL_VIDEODRIVER: dummy  # pygame (joystick device) without a display
      PYGAME_HIDE_SUPPORT_PROMPT: "1"
      GIT_PYTHON_REFRESH: quiet
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ml_training/requirements.txt
      - name: System libraries (OpenGL for MuJoCo)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libgl1 libegl1 libosmesa6 libglfw3
      - name: Python dependencies
        # CPU PyTorch, as in the Dockerfile: the policy is small and CUDA wheels are large
        run: |
          pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt
      - name: Tests with coverage (fails below 90%, see pyproject.toml)
        run: python -m pytest --cov --cov-config=../pyproject.toml --cov-report=term --cov-report=xml:coverage.xml tests
      - name: Upload the coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: ml_training/coverage.xml
          if-no-files-found: ignore
