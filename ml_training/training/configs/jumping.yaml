# Periodic crouch-and-jump from scratch.
#   python training/train.py training/configs/jumping.yaml

run:
  name: jumping
  total_steps: 20_000_000
  checkpoints: {every_steps: 500_000, every_minutes: 0}

command:
  fixed: {mode: still}

reward:
  jumping: {}

ppo:
  learning_rate: 3.0e-4
  learning_rate_final: 0.0   # linear decay to zero
  n_steps: 2048
  batch_size: 64
  n_epochs: 10
  gamma: 0.99
  gae_lambda: 0.95
  clip_range: 0.2
  ent_coef: 0.01
