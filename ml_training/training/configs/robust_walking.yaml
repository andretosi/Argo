# Robust omnidirectional walking with curricula.
#   python training/train.py training/configs/robust_walking.yaml

run:
  name: robust_walking
  total_steps: 10_000_000
  n_envs: 16                # parallel simulations; ppo.n_steps is per environment
  checkpoints: {every_steps: 500_000, every_minutes: 5}

env:
  max_episode_len: 3000

command:
  random:
    p_base2still: 0.05      # initial command mix
    p_base2walk: 0.70
    p_base2turn: 0.25
    p_still2walk: 0.80
    p_still2turn: 0.20
    p_walk2still: 0.20
    p_walk2turn: 0.80
    p_turn2still: 0.10
    p_turn2walk: 0.90
    v_mean: [0.0, 0.0]      # walk commands centred on zero: forward/backward and sideways
    v_var: [0.35, 0.25]
    v_steps_mean: 220       # hold each walk command for a few seconds
    v_steps_var: 30
    w_mean: 0.0
    w_var: 0.35
    w_radius_mean: 0.10     # mostly turning on the spot
    w_radius_var: 0.15
    w_steps_mean: 120
    w_steps_var: 18
    s_steps_mean: 25        # short pauses
    s_steps_var: 6

reward:
  robust_walking:
    tracking_lin_vel: 1.25
    tracking_ang_vel: 0.75
    tracking_sigma: 0.25
    feet_air_time: 0.5
    lin_vel_z: -2.0
    ang_vel_xy: -0.1
    orientation: -1.5
    base_height: -1.5
    action_rate: -0.02
    torques: -0.00002
    dof_acc: -5.0e-7
    power: -0.0002

curriculum:
  progression: competence   # advance when the policy is competent, not with time
  competence: {ema_alpha: 0.10, threshold: 0.70, advance_step: 0.05, min_episodes_between_advances: 10}
  terrain:      {schedule: exponential, warmup: 0.10, z_max: [0.01, 0.10], change_every_episodes: 80}
  push:         {schedule: exponential, warmup: 0.25, velocity: [0.0, 0.80], interval_s: 20.0, duration_steps: 2}
  friction:     {schedule: exponential, warmup: 0.15, low: [0.85, 0.65], high: [1.15, 1.25]}
  motor_noise:  {schedule: exponential, warmup: 0.30, std: [0.0, 0.02], noise_type: gaussian}
  sensor_noise: {schedule: exponential, warmup: 0.25, scale: [0.0, 0.5], dof_pos_noise: 0.01, dof_vel_noise: 1.5, lin_vel_noise: 0.1, ang_vel_noise: 0.2}

ppo:
  learning_rate: 3.0e-4
  learning_rate_final: 1.0e-5   # linear decay
  ent_coef: 0.01
  clip_range: 0.2
  n_steps: 128                  # x 16 environments = 2048 steps per rollout
  batch_size: 64
  gamma: 0.99
  gae_lambda: 0.95
